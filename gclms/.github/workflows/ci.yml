name: GCLMS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx fastapi pydantic sqlalchemy asyncpg alembic structlog pytest-asyncio
        working-directory: services/api

      - name: Run Ruff Lint
        run: ruff check .
        working-directory: services/api

      - name: Run Pytest
        run: pytest -v
        working-directory: services/api

  frontend-checks:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: apps/web

      - name: Run Next.js Lint
        run: npm run lint
        working-directory: apps/web
